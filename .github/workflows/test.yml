name: test

on: pull_request

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # mlflow-skinny needs sqlalchemy and alembic for SQLite, the tests' (and MLflow's default) backend.
      - run: pip install pytest==8.3.3 pyyaml==6.0.2 mlflow-skinny==3.17.1 sqlalchemy==2.0.54 alembic==1.20.0
      - run: python -m pytest -q
